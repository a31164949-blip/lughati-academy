name: Poll voter privacy unit checks
on:
  pull_request:
    paths:
      - 'lughati-next/app/api/teacher/polls/**'
      - 'lughati-next/tests/poll-voter-privacy.test.mjs'
      - '.github/workflows/poll-voter-privacy.yml'
  workflow_dispatch:
jobs:
  privacy-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run voter identity authorization unit tests
        working-directory: lughati-next
        run: node --experimental-strip-types --test tests/poll-voter-privacy.test.mjs
